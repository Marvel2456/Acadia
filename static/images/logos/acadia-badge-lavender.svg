<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <path id="lavenderCirclePath" d="M 100, 100 m -68, 0 a 68,68 0 1,1 136,0 a 68,68 0 1,1 -136,0" />
  </defs>

  <!-- Lavender background circle with crisp border -->
  <circle cx="100" cy="100" r="95" fill="#E8A9EF" stroke="#171717" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFFBEF" stroke-width="2.5" stroke-dasharray="3,3"/>
  <circle cx="100" cy="100" r="76" fill="#FFFBEF" stroke="#171717" stroke-width="2.5"/>
  
  <!-- Text around circle -->
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#171717" letter-spacing="2.5">
    <textPath href="#lavenderCirclePath" startOffset="50%" text-anchor="middle">
      ★ ACADIA CAKES &amp; PACKAGES ★
    </textPath>
  </text>
  
  <!-- Central Lavender Medallion -->
  <circle cx="100" cy="100" r="54" fill="#E8A9EF" fill-opacity="0.3" stroke="#171717" stroke-width="2.5"/>
  
  <!-- Ornate 'A' Initial -->
  <g transform="translate(100, 114)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="62" font-weight="900" font-style="italic" fill="#171717" text-anchor="middle">
      A
    </text>
    <!-- Little bow / floral accent above A -->
    <path d="M-10,-46 C-5,-50 0,-44 0,-44 C0,-44 5,-50 10,-46 C12,-38 0,-34 0,-34 C0,-34 -12,-38 -10,-46 Z" fill="#E0E77A" stroke="#171717" stroke-width="1.2"/>
  </g>
  
  <!-- Soft Lime & Warm Orange Dots -->
  <circle cx="48" cy="100" r="4.5" fill="#E0E77A" stroke="#171717" stroke-width="1.5"/>
  <circle cx="152" cy="100" r="4.5" fill="#FFBD55" stroke="#171717" stroke-width="1.5"/>
  
  <!-- Est 2024 bottom tag -->
  <rect x="74" y="146" width="52" height="18" rx="9" fill="#171717"/>
  <text x="100" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#E8A9EF" text-anchor="middle" letter-spacing="1">
    EST. 2024
  </text>
</svg>
