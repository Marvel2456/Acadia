{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — Acadia CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl border border-stone-200 p-8 sm:p-10 max-w-md w-full shadow-xl space-y-6">
    
    <div class="text-center space-y-2">
      <img src="{% static 'images/logos/acadia-badge.svg' %}" alt="Acadia" class="w-16 h-16 mx-auto">
      <h1 class="text-2xl font-black text-stone-900">Acadia Staff CMS</h1>
      <p class="text-xs text-stone-500">Sign in with your administrative account</p>
    </div>

    {% if error_msg %}
      <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold">
        {{ error_msg }}
      </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">
          Username
        </label>
        <input type="text" name="username" required autofocus placeholder="admin" class="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">
          Password
        </label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>
      <button type="submit" class="w-full py-3.5 px-6 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-bold text-sm shadow transition-colors">
        Sign In to Dashboard &rarr;
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="{% url 'cms:home' %}" class="text-xs text-stone-400 hover:text-stone-700">
        &larr; Return to Public Website
      </a>
    </div>

  </div>
</body>
</html>
